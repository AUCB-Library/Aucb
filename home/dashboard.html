  <script>
    function updateDateTime() {
      const now = new Date();
      
      // Format date
      const date = now.toLocaleDateString('en-US', {
  weekday: 'long',
  year: 'numeric',
  month: 'long',
  day: 'numeric',
}); 
      // Format time
      const time = now.toLocaleTimeString(); // e.g. "2:35:12 PM"
      
      // Display in HTML
      document.getElementById('date').textContent = date;
      document.getElementById('time').textContent =  time;
    }

    // Update every second
    setInterval(updateDateTime, 1000);

    // Initial display
    updateDateTime();

  </script>
